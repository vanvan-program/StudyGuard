allprojects {
    afterEvaluate {
        if (path == ':app') {
            tasks.register('studyGuardEvidence') {
                dependsOn 'compileDebugUnitTestKotlin', 'transformDebugUnitTestClassesWithAsm', 'bundleDebugClassesToRuntimeJar'
                doLast {
                    def outputDirectory = new File(rootDir, 'build/studyguard-evidence')
                    outputDirectory.mkdirs()
                    def testTask = tasks.named('testDebugUnitTest').get()
                    new File(outputDirectory, 'test-classpath.txt').setText(testTask.classpath.asPath, 'UTF-8')
                    def components = configurations.debugRuntimeClasspath.incoming.resolutionResult.allComponents
                        .findAll { it.id instanceof org.gradle.api.artifacts.component.ModuleComponentIdentifier }
                        .collect { it.moduleVersion }
                        .findAll { it != null }
                        .collect { "${it.group},${it.name},${it.version}" }
                        .unique().sort()
                    new File(outputDirectory, 'runtime-components.csv').setText('group,artifact,version\n' + components.join('\n') + '\n', 'UTF-8')
                }
            }
        }
    }
}
